<app-scrollspy-nav-layout [headings]="headings()">
  @if (notFound()) {
    <h1>Page not found</h1>
    <p>There is no documentation page for <code>{{ page() }}</code>.</p>
  } @else if (loadError()) {
    <h1>Page could not be loaded</h1>
    <p role="alert">The documentation page <code>{{ page() || 'README' }}</code> could not be loaded. Check your
      connection and try again.</p>
    <button class="docs-retry" mat-stroked-button type="button" (click)="retry()">Retry</button>
  } @else {
    <markdown class="docs-page"
              [src]="src()"
              [frontMatter]="true"
              [headingIds]="true"
              [clipboard]="true"
              [routerLinkOptions]="{ internalBrowserHandler: true }"
              (headings)="onHeadings($event)"
              (ready)="onReady()"
              (error)="onError($event)" />
  }
</app-scrollspy-nav-layout>
