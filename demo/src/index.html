<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>&#64;fsegurai/ngx-sidenav | Demo</title>
  <base href="/">
  <meta name="description" content="Angular component for creating a resizeable sidenav with drag and drop functionality.">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="favicon.ico" rel="icon" type="image/x-icon">

  <!-- Fonts -->
  <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500;600&family=DM+Mono:ital@0;1&display=swap"
      rel="stylesheet"
  />
  <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
  />
</head>
<body class="mat-app-background">
<script>
  // Apply the stored theme before the app boots, so there is no light/dark flash.
  // Keep the key and values in sync with LOCAL_STORAGE_THEME_KEY, DEFAULT_THEME and Theme in demo/src/app.
  (() => {
    var theme = 'light';
    var stored;
    try {
      stored = localStorage.getItem('ngx-sidenav:theme');
      if (stored === 'light' || stored === 'dark') theme = stored;
    } catch {}
    document.body.classList.add(`${theme}-theme`);
  })();
</script>
<app-root></app-root>
</body>
</html>
